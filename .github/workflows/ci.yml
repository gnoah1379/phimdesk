name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Kiểm tra kiểu và build giao diện + tiến trình main. Không đóng gói
      # installer ở đây (mất nhiều thời gian hơn và cần đúng OS đích), việc đó
      # thuộc về workflow release.yml khi có tag mới.
      - run: npm run build
